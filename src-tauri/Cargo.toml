[package]
name = "renaissance-man"
version = "0.1.0"
edition = "2021"

[lib]
name = "renaissance_man_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-shell  = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
rusqlite     = { version = "0.31", features = ["bundled"] }
walkdir      = "2"
anyhow       = "1"
tokio        = { version = "1", features = ["full"] }
thiserror    = "1"
chrono       = { version = "0.4", features = ["serde"] }
gray_matter  = "0.2"
regex        = "1"
base64       = "0.22"
zip          = { version = "2", default-features = false, features = ["deflate"] }

# The MiniLM embedder (ONNX runtime) only builds/runs on desktop; mobile
# degrades to FTS search per the guards in commands/search.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
fastembed    = "4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level  = "s"
strip      = true
lto        = true
panic      = "abort"
codegen-units = 1
